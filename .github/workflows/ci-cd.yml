name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, tests, coverage and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit, API and Cucumber tests with coverage gate
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build the optimized Docker image
        run: |
          docker build --pull \
            --tag "ms-despacho:${GITHUB_SHA}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" .

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/cucumber/cucumber.html
          if-no-files-found: warn
          retention-days: 7

      - name: Require SonarCloud configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Configure SONAR_TOKEN, SONAR_ORGANIZATION and SONAR_PROJECT_KEY before running the gated pipeline."
            exit 1
          fi

      - name: Analyze code and enforce the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            sonar:sonar \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

  deploy:
    name: Deploy simulation with Docker Compose
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: ms-despacho
      IMAGE_TAG: ${{ github.sha }}
      HOST_PORT: "8080"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate an ephemeral database password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Build and start the simulated deployment
        run: docker compose up --build --detach --wait --wait-timeout 120 --scale despacho-svc=2

      - name: Verify the deployed API
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "http://localhost:${HOST_PORT}/api/despachos" > /dev/null

          response=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"nombre":"smoke-ci","repartidor":"ci","ruta":"ci"}' \
            "http://localhost:${HOST_PORT}/api/despachos")
          id=$(jq -er '.id' <<< "$response")
          curl --fail --silent --show-error \
            "http://localhost:${HOST_PORT}/api/despachos/${id}" \
            | jq -e '.nombre == "smoke-ci"' > /dev/null
          curl --fail --silent --show-error -X DELETE \
            "http://localhost:${HOST_PORT}/api/despachos/${id}" > /dev/null

      - name: Record deployment trace
        run: |
          printf 'commit_sha=%s\nimage=%s:%s\nreplicas=2\nproxy=nginx\ndatabase=postgresql\ndeployed_at_utc=%s\nsmoke_test=passed\n' \
            "$GITHUB_SHA" "$IMAGE_NAME" "$IMAGE_TAG" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee deployment-metadata.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-metadata-${{ github.sha }}
          path: deployment-metadata.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the simulated deployment
        if: always()
        run: docker compose down --remove-orphans
