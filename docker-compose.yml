name: ms-despacho-ep2-ep3

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: despachodb
      POSTGRES_USER: despacho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-despacho_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U despacho -d despachodb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  despacho-svc:
    image: ${IMAGE_NAME:-ms-despacho}:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        VCS_REF: ${GITHUB_SHA:-local}
    expose:
      - "8080"
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/despachodb
      SPRING_DATASOURCE_USERNAME: despacho
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-despacho_local}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 2
      endpoint_mode: vip
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  proxy:
    image: nginx:1.30.6-alpine
    user: "101:101"
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      despacho-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/despachos"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/k8s/config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - despacho-svc
      - pushgateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  pushgateway:
    image: prom/pushgateway:v1.11.3
    profiles: [observability]
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  loki:
    image: grafana/loki:3.7.10
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki-config.yaml", "-target=all"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/k8s/config/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  alloy:
    image: grafana/alloy:v1.21.3
    profiles: [observability]
    environment:
      ALLOY_DOCKER_PROJECT: ${COMPOSE_PROJECT_NAME:-ms-despacho-ep2-ep3}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/k8s/config/observability/alloy/docker.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/k8s/config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/k8s/config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
