global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: despacho
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["despacho-svc"]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
