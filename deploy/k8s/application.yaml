apiVersion: v1
kind: ServiceAccount
metadata:
  name: despacho
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: despacho-svc
  labels:
    app: despacho-svc
    app.kubernetes.io/name: despacho-svc
    app.kubernetes.io/part-of: ms-despacho
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: despacho-svc
  template:
    metadata:
      labels:
        app: despacho-svc
        app.kubernetes.io/name: despacho-svc
        app.kubernetes.io/part-of: ms-despacho
    spec:
      serviceAccountName: despacho
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: despacho-svc
          image: ms-despacho:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: despacho-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: despacho-svc
  labels:
    app: despacho-svc
spec:
  type: ClusterIP
  selector:
    app: despacho-svc
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: despacho-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: despacho-svc
